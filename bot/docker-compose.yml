services:
  bot:
    container_name: bot
    profiles: ["dev-bot"]
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    command: ["sh", "-c", "alembic upgrade head && exec python -m bot"]
    env_file: ../.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  db:
    container_name: db
    image: postgres:13-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    command: "postgres -c max_connections=150 -c shared_buffers=512MB -c effective_cache_size=1536MB -c maintenance_work_mem=128MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=3495kB -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=2 -c max_parallel_workers_per_gather=1 -c max_parallel_workers=2 -c max_parallel_maintenance_workers=1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-bot}"
    networks:
      - app-net

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    command: redis-server --port 6388 --save 20 1 --loglevel warning --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6388 -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    networks:
      - app-net

networks:
  app-net:

volumes:
  db-data:
  redis-data:
