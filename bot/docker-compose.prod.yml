services:
  bot:
    container_name: bot
    image: bot
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: ["sh", "-c", "alembic upgrade head && exec python -m bot"]
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  db:
    container_name: db
    image: postgres:13-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    command: "postgres -c max_connections=150 -c shared_buffers=512MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U someusername -d bot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      POSTGRES_USER: someusername
      POSTGRES_PASSWORD: postgres_pass12345
      POSTGRES_DB: bot
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    command: redis-server --port 6388 --save 20 1 --loglevel warning --requirepass someredispass
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6388 -a someredispass ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - app-net

networks:
  app-net:

volumes:
  db-data:
  redis-data:
