services:
  bot:
    container_name: bot
    image: bot
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: ["sh", "-c", "alembic upgrade head && exec python -m bot"]
    restart: always
    depends_on:
      - db
      - redis
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  db:
    container_name: db
    image: postgres:13-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    command: "postgres -c max_connections=150 -c shared_buffers=512MB"
    environment:
      POSTGRES_USER: someusername
      POSTGRES_PASSWORD: postgres_pass12345
      POSTGRES_DB: bot
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  redis:
    container_name: redis
    image: redis:6.2-alpine
    restart: always
    command: redis-server --port 6388 --save 20 1 --loglevel warning --requirepass someredispass
    volumes:
      - redis-data:/data
    networks:
      - app-net

networks:
  app-net:

volumes:
  db-data:
  redis-data:
