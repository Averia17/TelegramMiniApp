server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;

    client_max_body_size 32k;
    server_tokens off;

    set $account_backend http://account:8000;
    set $shop_backend http://shop:8000;
    set $battle_backend http://battle:8000;
    set $leaderboard_backend http://leaderboard:8001;
    set $party_backend http://party:8002;

    # Public BFF contract: account authentication and current-user operations only.
    location = /api/accounts/auth/telegram {
        if ($request_method != POST) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/accounts/economy/me {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/accounts/economy/me/battle {
        if ($request_method != POST) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/accounts/economy/me/taunt {
        if ($request_method != POST) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/accounts/economy/me/taunt-pack {
        if ($request_method != POST) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/accounts/economy/me/chests/[0-9]+/open$ {
        if ($request_method != POST) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/accounts/users/me/profile {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/accounts/users/me/nickname {
        if ($request_method != PATCH) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/accounts/users/me/accept_invite {
        if ($request_method != POST) { return 405; }
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $account_backend;
        include /etc/nginx/proxy_params;
    }

    # Product reads and authenticated purchases; payment/refund are never public.
    location ~ ^/api/products/?$ {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/products/?$ /api/products/ break;
        proxy_pass $shop_backend;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/products/[0-9]+/buy$ {
        if ($request_method != POST) { return 405; }
        rewrite ^/api/products/(.*)$ /api/products/$1 break;
        proxy_pass $shop_backend;
        include /etc/nginx/proxy_params;
    }

    # Battle exposes only hero metadata and the authenticated WebSocket.
    location = /api/battle/heroes {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/battle/(.*)$ /$1 break;
        proxy_pass $battle_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/battle/map-preview {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/battle/(.*)$ /$1 break;
        proxy_pass $battle_backend;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-store" always;
    }

    location = /api/battle/ws {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/battle/(.*)$ /$1 break;
        proxy_pass $battle_backend;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 15;
    }

    # Leaderboard is read-only at the public edge.
    location = /api/leaderboard {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/leaderboard$ /leaderboard break;
        proxy_pass $leaderboard_backend;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/leaderboard/profile/[0-9]+$ {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/leaderboard(.*)$ /leaderboard$1 break;
        proxy_pass $leaderboard_backend;
        include /etc/nginx/proxy_params;
    }

    # Party/invite/history API is authenticated by the service.
    location = /api/party {
        rewrite ^/api/party$ /party break;
        proxy_pass $party_backend;
        include /etc/nginx/proxy_params;
    }

    location = /api/party/ws {
        rewrite ^/api/party/ws$ /party/ws break;
        proxy_pass $party_backend;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 15;
    }

    location ^~ /api/party/ {
        rewrite ^/api/party/(.*)$ /party/$1 break;
        proxy_pass $party_backend;
        include /etc/nginx/proxy_params;
    }

    # Everything not explicitly listed above is outside the browser contract.
    location /api/ {
        return 404;
    }

    # Vite serves nested HTML files but does not resolve a directory index for
    # the QA folder. Keep the user-facing /test/ URL stable in local dev.
    location = /test/ {
        proxy_pass http://frontend:5173/test/index.html;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location / {
        set $frontend_backend http://frontend:5173;
        proxy_pass $frontend_backend;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }
}
