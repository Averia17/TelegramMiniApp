server {
    listen 80;
    server_name _;

    location ^~ /api/products {
        proxy_pass http://shop:8000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/accounts/ {
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass http://account:8000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/battle/ {
        rewrite ^/api/battle/(.*)$ /$1 break;
        proxy_pass http://battle:8000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location ^~ /api/leaderboard {
        rewrite ^/api/leaderboard(.*)$ /leaderboard$1 break;
        proxy_pass http://leaderboard:8001;
        include /etc/nginx/proxy_params;
    }

    # Both the root page and BrowserRouter paths are served by Vite.
    location / {
        proxy_pass http://frontend:5173;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
