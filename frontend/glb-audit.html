<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB export audit</title>
  <style>
    body { margin: 0; padding: 24px; color: #e8edf7; background: #10141d; font: 14px/1.45 system-ui, sans-serif; }
    h1 { margin: 0 0 16px; font-size: 22px; }
    #summary { margin-bottom: 16px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; background: #181e2a; }
    th, td { padding: 9px 12px; border-bottom: 1px solid #2b3445; text-align: left; }
    .ok { color: #6ee7a5; }
    .fail { color: #ff7d8d; }
    #renders { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
    .render-card { padding: 10px; text-align: center; background: #181e2a; border-radius: 8px; }
    canvas { width: 100%; max-width: 260px; background: #26344d; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>GLB export audit</h1>
  <div id="summary">Загрузка…</div>
  <table>
    <thead><tr><th>Файл</th><th>Статус</th><th>Меши</th><th>Кости</th><th>Socket</th><th>Анимации</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
  <div id="renders"></div>
  <h1 style="margin-top:24px">Runtime weapon attachment</h1>
  <table>
    <thead><tr><th>Герой</th><th>Статус</th><th>Socket → grip</th><th>Socket → geometry</th></tr></thead>
    <tbody id="runtime-results"></tbody>
  </table>
  <script type="module">
    import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js"
    import * as THREE from "three"
    import {assetRegistry} from "./src/components/BattleGame/rendering/assets/AssetRegistry.js"

    const urls = [
      "/assets/heroes/output_heroes/brock-zeus_base.glb",
      "/assets/heroes/output_heroes/damian_base.glb",
      "/assets/heroes/output_heroes/fairy-mina_base.glb",
      "/assets/heroes/output_heroes/kaze_base.glb",
      "/assets/heroes/output_heroes/mandy_base.glb",
      "/assets/heroes/output_heroes/needle_base.glb",
      "/assets/heroes/output_heroes/persephone-lumi_base.glb",
      "/assets/heroes/output_heroes/wukong-mico_base.glb",
      "/assets/heroes/output_weapons/damian_weapon.glb",
      "/assets/heroes/output_weapons/kaze_weapon.glb",
      "/assets/heroes/output_weapons/mandy_weapon.glb",
      "/assets/heroes/output_weapons/persephone-lumi_weapon.glb",
      "/assets/heroes/output_weapons/wukong-mico_weapon.glb",
    ]
    const loader = new GLTFLoader()
    const results = []
    for (const url of urls) {
      try {
        const gltf = await loader.loadAsync(url)
        const counts = {meshes: 0, bones: 0, sockets: 0}
        gltf.scene.traverse(object => {
          if (object.isMesh || object.isSkinnedMesh) counts.meshes += 1
          if (object.isBone) counts.bones += 1
          if (object.name === "weapon_socket_r") counts.sockets += 1
        })
        const isBase = url.includes("/output_heroes/")
        const ok = counts.meshes > 0 && (!isBase || counts.sockets === 1)
        results.push({...counts, url, ok, animations: gltf.animations.length})
      } catch (error) {
        results.push({url, ok: false, error: String(error), meshes: 0, bones: 0, sockets: 0, animations: 0})
      }
    }
    const body = document.querySelector("#results")
    for (const result of results) {
      const row = document.createElement("tr")
      row.innerHTML = `
        <td>${result.url.split("/").at(-1)}</td>
        <td class="${result.ok ? "ok" : "fail"}">${result.ok ? "OK" : result.error || "INVALID"}</td>
        <td>${result.meshes}</td><td>${result.bones}</td><td>${result.sockets}</td><td>${result.animations}</td>`
      body.append(row)
    }
    const passed = results.filter(result => result.ok).length
    const summary = document.querySelector("#summary")
    summary.textContent = `${passed}/${results.length} GLB успешно загружены через Three.js`
    summary.dataset.complete = "true"
    summary.dataset.passed = String(passed)
    summary.dataset.total = String(results.length)
    window.__GLB_AUDIT__ = results

    const runtimeHeroes = ["Mandy", "Kaze", "Wukong Mico", "Damian", "Persephone Lumi"]
    const runtimeResults = []
    for (const hero of runtimeHeroes) {
      try {
        const instance = await assetRegistry.instantiateHero(hero)
        instance.root.updateMatrixWorld(true)
        const distances = instance.asset.weaponAttachments.map(config => {
          const socket = instance.root.getObjectByName(config.target || config.bone)
          const weapon = instance.root.getObjectByName(`DetachedHeroWeapon.${config.name}`)
          const socketPosition = socket?.getWorldPosition(new THREE.Vector3())
          const gripPosition = weapon?.getWorldPosition(new THREE.Vector3())
          return {
            grip: socketPosition && gripPosition ? socketPosition.distanceTo(gripPosition) : Infinity,
            geometry: weapon && socketPosition
              ? new THREE.Box3().setFromObject(weapon, true).distanceToPoint(socketPosition)
              : Infinity,
          }
        })
        const gripDistance = Math.max(...distances.map(distance => distance.grip))
        const geometryDistance = Math.max(...distances.map(distance => distance.geometry))
        const diagnosticNames = []
        instance.root.traverse(object => {
          if (/Grip\.Primary|DetachedHeroWeapon|HeroAttachment/i.test(object.name)) diagnosticNames.push(object.name)
        })
        runtimeResults.push({
          hero,
          ok: gripDistance < 1e-5 && geometryDistance < .12,
          gripDistance,
          geometryDistance,
          diagnosticNames,
          targets: instance.asset.weaponAttachments,
        })

        const card = document.createElement("div")
        card.className = "render-card"
        card.innerHTML = `<strong>${hero}</strong><br>`
        const canvas = document.createElement("canvas")
        canvas.width = 260
        canvas.height = 320
        card.append(canvas)
        document.querySelector("#renders").append(card)
        const renderer = new THREE.WebGLRenderer({canvas, alpha: true, antialias: true})
        renderer.setSize(260, 320, false)
        renderer.outputColorSpace = THREE.SRGBColorSpace
        const scene = new THREE.Scene()
        const camera = new THREE.OrthographicCamera(-2, 2, 2.45, -2.45, .1, 30)
        camera.position.set(4.5, 3.8, 7.2)
        camera.lookAt(0, 1.25, 0)
        scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x41344f, 2.5))
        const light = new THREE.DirectionalLight(0xffffff, 4)
        light.position.set(-3, 6, 5)
        scene.add(light)
        instance.root.rotation.y = .42
        scene.add(instance.root)
        renderer.render(scene, camera)
      } catch (error) {
        runtimeResults.push({hero, ok: false, error: String(error), gripDistance: Infinity, geometryDistance: Infinity})
      }
    }
    const runtimeBody = document.querySelector("#runtime-results")
    for (const result of runtimeResults) {
      const row = document.createElement("tr")
      row.innerHTML = `
        <td>${result.hero}</td>
        <td class="${result.ok ? "ok" : "fail"}">${result.ok ? "ATTACHED" : result.error || "INVALID"}</td>
        <td>${Number.isFinite(result.gripDistance) ? result.gripDistance.toFixed(6) : "—"}</td>
        <td>${Number.isFinite(result.geometryDistance) ? result.geometryDistance.toFixed(6) : "—"}</td>`
      runtimeBody.append(row)
    }
    summary.dataset.runtimeComplete = "true"
    summary.dataset.runtimePassed = String(runtimeResults.filter(result => result.ok).length)
    summary.dataset.runtimeDiagnostics = JSON.stringify(runtimeResults)
    window.__WEAPON_ATTACHMENT_AUDIT__ = runtimeResults
  </script>
</body>
</html>
