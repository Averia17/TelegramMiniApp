<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Map Environment Lab</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #132536; }
    body { color: #eef5ff; }
    canvas { display: block; width: 100%; height: 100%; }
    #app { position: relative; width: 100%; height: 100%; }
    #state { position: absolute; z-index: 2; left: 18px; top: 16px; max-width: min(520px, calc(100vw - 36px)); padding: 10px 13px; border: 1px solid #ffffff24; border-radius: 12px; background: #13203ddd; box-shadow: 0 10px 28px #0004; font-size: 13px; font-weight: 800; }
    #hud { position: absolute; z-index: 2; right: 16px; top: 16px; display: grid; gap: 8px; width: min(300px, calc(100vw - 32px)); padding: 14px; border: 1px solid #ffffff1f; border-radius: 15px; background: #13203ddd; box-shadow: 0 10px 28px #0004; }
    #hud h1 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    #hud p { margin: 0; color: #b6c7e6; font-size: 12px; line-height: 1.45; }
    #stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 2px; }
    .stat { padding: 8px; border-radius: 9px; background: #243653aa; }
    .stat small, .stat strong { display: block; }
    .stat small { color: #9eb2d5; font-size: 10px; }
    .stat strong { margin-top: 2px; font-size: 14px; }
    .actions { display: flex; gap: 7px; }
    button, a { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 8px 10px; border: 1px solid #6881ae; border-radius: 9px; color: #fff; background: #263b63; font: 700 12px inherit; text-decoration: none; cursor: pointer; }
    button:hover, a:hover { border-color: #ffdc65; background: #8f513d; }
    #legend { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 7px; border-radius: 7px; color: #dce8ff; background: #ffffff12; font-size: 10px; }
    .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--chip); }
    #help { position: absolute; z-index: 2; left: 18px; bottom: 16px; padding: 8px 10px; border-radius: 9px; color: #d7e5ff; background: #13203dcc; font-size: 11px; }
    @media (max-width: 720px) {
      #hud { top: auto; bottom: 16px; width: min(320px, calc(100vw - 32px)); }
      #help { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="state">Загрузка настоящей battle-royale карты…</div>
    <aside id="hud">
      <h1>Map Environment Lab</h1>
      <p>Каноническая battle-карта из API + настоящий <code>MapRenderer</code>: рельеф острова, вода, кусты и процедурные map-пропы без environment GLB.</p>
      <div id="stats">
        <div class="stat"><small>Размер</small><strong id="map-size">—</strong></div>
        <div class="stat"><small>Коллизии</small><strong id="wall-count">—</strong></div>
        <div class="stat"><small>Кусты</small><strong id="bush-count">—</strong></div>
        <div class="stat"><small>Рендер-объекты</small><strong id="object-count">—</strong></div>
      </div>
      <div class="actions">
        <button id="reset-view" type="button">Сбросить вид</button>
        <a href="./index.html">← QA hub</a>
      </div>
      <div id="legend"></div>
    </aside>
    <div id="help">ЛКМ — вращение · колесо — масштаб · ПКМ — панорама</div>
    <canvas id="scene" aria-label="3D preview of the battle royale map"></canvas>
  </div>
  <script type="module">
    import * as THREE from "three"
    import {OrbitControls} from "three/addons/controls/OrbitControls.js"
    import {MapRenderer} from "/src/components/BattleGame/rendering/map/MapRenderer.js"
    import {WORLD_SCALE} from "/src/components/BattleGame/rendering/shared/coordinates.js"

    const canvas = document.querySelector("#scene")
    const state = document.querySelector("#state")
    const mapSize = document.querySelector("#map-size")
    const wallCount = document.querySelector("#wall-count")
    const bushCount = document.querySelector("#bush-count")
    const objectCount = document.querySelector("#object-count")
    const loadMap = async () => {
      const response = await fetch("/api/battle/map-preview?seed=20260810")
      if (!response.ok) throw new Error(`Map API returned ${response.status}`)
      const payload = await response.json()
      return {...payload.map, seed: payload.seed, spawners: payload.spawners}
    }
    const map = await loadMap()
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0xd87850)

    const renderer = new THREE.WebGLRenderer({canvas, antialias: true})
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.08
    renderer.shadowMap.enabled = true
    renderer.shadowMap.type = THREE.PCFSoftShadowMap

    const fill = new THREE.HemisphereLight(0xdaf1ff, 0x4c3528, 1.8)
    const sun = new THREE.DirectionalLight(0xfff3df, 3.4)
    sun.position.set(-90, 150, 105)
    sun.castShadow = true
    sun.shadow.mapSize.set(1024, 1024)
    sun.shadow.camera.near = 1
    sun.shadow.camera.far = 330
    sun.shadow.camera.left = -145
    sun.shadow.camera.right = 145
    sun.shadow.camera.top = 145
    sun.shadow.camera.bottom = -145
    scene.add(fill, sun, sun.target)

    const mapRoot = new THREE.Group()
    scene.add(mapRoot)
    const mapRenderer = new MapRenderer(mapRoot, {lowQuality: true})
    const center = new THREE.Vector3(map.width * WORLD_SCALE / 2, 0, map.height * WORLD_SCALE / 2)
    const BATTLE_CAMERA_ANGLE = THREE.MathUtils.degToRad(55)
    const camera = new THREE.PerspectiveCamera(35, 1, .1, 360)
    const controls = new OrbitControls(camera, canvas)
    controls.enableDamping = true
    controls.dampingFactor = .08
    const battlePolarAngle = Math.PI / 2 - BATTLE_CAMERA_ANGLE
    controls.minPolarAngle = battlePolarAngle
    controls.maxPolarAngle = battlePolarAngle
    controls.minDistance = 55
    controls.maxDistance = 270
    controls.target.copy(center)

    const spawnOverlay = new THREE.Group()
    map.spawners.forEach(spawn => {
      const pad = new THREE.Mesh(
        new THREE.PlaneGeometry(spawn.width * WORLD_SCALE, spawn.height * WORLD_SCALE),
        new THREE.MeshBasicMaterial({color: 0x65eeff, transparent: true, opacity: .22, depthWrite: false}),
      )
      pad.rotation.x = -Math.PI / 2
      pad.position.set((spawn.x + spawn.width / 2) * WORLD_SCALE, .055, (spawn.y + spawn.height / 2) * WORLD_SCALE)
      spawnOverlay.add(pad)
    })
    scene.add(spawnOverlay)

    const boundary = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(map.width * WORLD_SCALE, .08, map.height * WORLD_SCALE)),
      new THREE.LineBasicMaterial({color: 0xb7ffbc, transparent: true, opacity: .35}),
    )
    boundary.position.copy(center)
    boundary.position.y = .12
    scene.add(boundary)

    const colors = {
      water: "#32bce8", bush: "#72d33e", wall: "#d8a24a", destructible: "#e17f54",
      tree: "#4d9f67", "altar_three_moons": "#9a8cff", menhir: "#b9c7dc", "sacrificial_stone": "#e28da1",
    }
    Object.entries(colors).forEach(([type, color]) => {
      const chip = document.createElement("span")
      chip.className = "chip"
      chip.style.setProperty("--chip", color)
      chip.innerHTML = `<i></i>${type.replaceAll("_", " ")}`
      document.querySelector("#legend").append(chip)
    })

    const setBattleView = (target, distance) => {
      controls.target.copy(target)
      camera.position.set(
        target.x,
        target.y + distance * Math.sin(BATTLE_CAMERA_ANGLE),
        target.z + distance * Math.cos(BATTLE_CAMERA_ANGLE),
      )
      controls.update()
    }
    const resetView = () => {
      setBattleView(center, 240)
    }
    document.querySelector("#reset-view").addEventListener("click", resetView)

    const updateHud = () => {
      mapSize.textContent = `${map.width} × ${map.height}`
      wallCount.textContent = map.walls.length.toLocaleString("ru-RU")
      bushCount.textContent = map.walls.filter(wall => wall.type === "bush").length.toLocaleString("ru-RU")
      objectCount.textContent = mapRenderer.objects.size.toLocaleString("ru-RU")
      state.textContent = mapRenderer.isReady() ? `Готово · battle-royale · seed ${map.seed}` : "Загрузка карты…"
    }

    mapRenderer.setFocus(map.width / 2, map.height / 2)
    mapRenderer.sync(map)
    mapRenderer.syncIsland({islandName: "Остров Первого Испытания", phase: "landing", stormRadius: 0}, map.width, map.height)
    resetView()
    updateHud()

    const resize = () => {
      renderer.setSize(innerWidth, innerHeight, false)
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
    }
    addEventListener("resize", resize)
    resize()

    const clock = new THREE.Clock()
    let hudTimer = 0
    renderer.setAnimationLoop(() => {
      const delta = Math.min(.05, clock.getDelta())
      controls.update()
      mapRenderer.update(delta)
      hudTimer += delta
      if (hudTimer >= .25) {
        hudTimer = 0
        updateHud()
      }
      renderer.render(scene, camera)
    })

    window.qa = {map, mapRenderer, scene, camera, controls, renderer}
    window.render_game_to_text = () => JSON.stringify({
      map: {width: map.width, height: map.height, seed: map.seed, walls: map.walls.length, spawners: map.spawners.length},
      wallTypes: Object.fromEntries(map.walls.reduce((counts, wall) => counts.set(wall.type, (counts.get(wall.type) || 0) + 1), new Map())),
      environment: {ready: mapRenderer.isReady(), total: 0, samples: 0, objects: mapRenderer.objects.size},
      camera: {position: camera.position.toArray().map(value => Number(value.toFixed(2))), target: controls.target.toArray().map(value => Number(value.toFixed(2)))},
      coordinateSystem: "world map origin top-left; Three.js scene +Y up, world Y maps to scene Z",
    })
  </script>
</body>
</html>
