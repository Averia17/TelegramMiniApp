<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Проверка героя</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI",sans-serif;--panel:rgba(24,29,37,.95);--line:#ffffff22;--ink:#f5f1e8;--muted:#aab4ba;--accent:#ff9f43;--ok:#74d9c4}
    *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{color:var(--ink);background:#1b2329}#app{position:relative}canvas{display:block;width:100%;height:100%}
    #status{position:absolute;z-index:3;top:14px;left:14px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:#181d25df;box-shadow:0 10px 28px #0005;font:700 12px "Cascadia Mono",Consolas,monospace}.ready{color:var(--ok)}
    #panel{position:absolute;z-index:4;top:14px;right:14px;width:min(330px,calc(100vw - 28px));padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 18px 56px #0006;backdrop-filter:blur(14px)}#panel.hidden{transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none}h1{margin:7px 0 4px;font:650 25px/1 Bahnschrift,"Arial Narrow",sans-serif}.eyebrow{color:var(--accent);font:800 10px "Cascadia Mono",Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}.hint{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.4}select,button{width:100%;margin:4px 0;padding:9px 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:#2d353d;font:700 12px "Segoe UI",sans-serif;cursor:pointer}button:hover,button.active,button:focus-visible{outline:2px solid var(--ok);outline-offset:1px;background:#3b514d}.group{margin-top:13px}.group strong{display:block;margin-bottom:5px;color:#dce3e4;font:800 10px "Cascadia Mono",Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}.readout{display:flex;justify-content:space-between;margin-top:13px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font:700 10px "Cascadia Mono",Consolas,monospace}.readout strong{color:var(--ink)}.zoom-row{display:grid;grid-template-columns:38px 1fr 38px;gap:5px;margin-top:10px}.zoom-row button{margin:0;min-height:30px;padding:0}.zoom-row output{display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;color:var(--muted);font:700 10px "Cascadia Mono",Consolas,monospace}#toggle{position:absolute;z-index:5;right:14px;bottom:14px;width:auto;padding:10px 13px;background:#181d25eb}@media(max-width:680px){#panel{top:auto;bottom:62px;padding:15px}h1{font-size:21px}.hint{display:none}}
  </style>
</head>
<body>
  <main id="app"><div id="status">Загрузка боевого героя…</div><aside id="panel"><div class="eyebrow">Battle hero / live renderer</div><h1>Проверка героя</h1><p class="hint">Тот же HeroView, GLB-контроллер, камера и свет, что используются в матче.</p><select id="hero-select" aria-label="Герой"></select><div class="group"><strong>Locomotion</strong><button data-animation="idle">Покой</button><button data-animation="run">Бег</button></div><div class="group"><strong>Skills</strong><button data-skill="attack">Основная атака</button><button data-skill="super">Супер</button><button data-skill="gadget">Gadget</button></div><div class="group"><strong>Events</strong><button data-animation="spawn">Появление</button><button data-animation="hit">Получил удар</button><button data-animation="victory">Победа</button><button data-animation="defeat">Поражение</button></div><div class="group"><strong>Aim</strong><button data-animation="aim">Прицел</button><button data-animation="aimSuper">Прицел супер</button><button data-animation="aimGadget">Прицел gadget</button></div><div class="readout"><span>Состояние</span><strong id="readout">idle</strong></div><div class="zoom-row"><button id="zoom-out" type="button" aria-label="Отдалить">−</button><output id="zoom-value">100%</output><button id="zoom-in" type="button" aria-label="Приблизить">+</button></div></aside><button id="toggle">Скрыть панель</button><canvas id="scene" aria-label="Проверка 3D героя"></canvas></main>
  <script type="module">
    import {ThreeBattleRenderer} from "/src/components/BattleGame/rendering/three/ThreeBattleRenderer.js"
    import {assetRegistry} from "/src/components/BattleGame/rendering/assets/AssetRegistry.js"
    import {resolveHeroName} from "/src/components/BattleGame/rendering/assets/assetManifest.js"
    import {loadCanonicalBattleMap} from "/src/components/BattleGame/canonicalMap.js"

    const query=new URLSearchParams(location.search), requestedHero=query.get("hero")||"Mandy", hero=resolveHeroName(requestedHero)
    const canvas=document.querySelector("#scene"), status=document.querySelector("#status"), panel=document.querySelector("#panel"), readout=document.querySelector("#readout")
    const select=document.querySelector("#hero-select")
    try {
      const heroesResponse=await fetch("/api/battle/heroes",{cache:"no-store"})
      const heroes=heroesResponse.ok?await heroesResponse.json():[{name:hero}]
      select.innerHTML=heroes.map(item=>`<option value="${item.name}">${item.name}</option>`).join(""); select.value=hero
    } catch { select.innerHTML=`<option>${hero}</option>`; select.disabled=true }
    select.addEventListener("change",()=>{const next=new URL(location.href);next.searchParams.set("hero",select.value);location.assign(next.href)})

    await assetRegistry.preloadHeroes([hero])
    const map=await loadCanonicalBattleMap()
    const player={hero,name:hero,x:map.width*.5,y:map.height*.75,rotation:Math.PI/2,lives:720,maxLives:720,speed:0,moveX:0,moveY:0,aiming:false,attackPulse:0,superPulse:0,gadgetPulse:0}
    const battleState={map,game:{islandName:"Остров Первого Испытания",phase:"landing",stormRadius:0},players:{qa:player},monsters:{},props:[],bullets:[],effects:[]}
    const battleRenderer=new ThreeBattleRenderer(canvas);battleRenderer.setLocalPlayerId("qa");battleRenderer.setState(battleState)
    // Runtime clip contract: aimGadget:"AimGadget" is resolved by GLBHeroController inside HeroView.
    const getView=()=>battleRenderer.players.get("qa"), setLabel=value=>{readout.textContent=value;status.textContent=`${hero} · ${value}`}
    const pulse=skill=>{if(skill==="attack")player.attackPulse++;if(skill==="super")player.superPulse++;if(skill==="gadget")player.gadgetPulse++;battleRenderer.setState(battleState);setLabel(`skill / ${skill}`)}
    document.querySelectorAll("[data-skill]").forEach(button=>button.addEventListener("click",()=>{pulse(button.dataset.skill);button.classList.add("active")}))
    document.querySelectorAll("[data-animation]").forEach(button=>button.addEventListener("click",()=>{const animation=button.dataset.animation,view=getView();if(animation==="run")player.moveY=1;else player.moveY=0;if(animation.startsWith("aim"))player.aiming=true;else player.aiming=false;if(animation==="victory"||animation==="defeat")view.setResult(animation);if(animation==="hit")player.lives=Math.max(1,player.lives-1);battleRenderer.setState(battleState);setLabel(`animation / ${animation}`);button.classList.add("active")}))
    document.querySelector("#toggle").addEventListener("click",event=>{const hidden=panel.classList.toggle("hidden");event.currentTarget.textContent=hidden?"Показать панель":"Скрыть панель"})
    let zoom=1.6;const applyZoom=()=>{battleRenderer.cameraRig.preferredVertical=31/zoom;document.querySelector("#zoom-value").textContent=`${Math.round(zoom*100)}%`};document.querySelector("#zoom-out").addEventListener("click",()=>{zoom=Math.max(.65,zoom-.1);applyZoom()});document.querySelector("#zoom-in").addEventListener("click",()=>{zoom=Math.min(1.8,zoom+.1);applyZoom()});canvas.addEventListener("wheel",event=>{event.preventDefault();if(!event.deltaY)return;zoom=Math.max(.65,Math.min(1.8,zoom*Math.pow(1.08,event.deltaY>0?-1:1)));applyZoom()},{passive:false})
    const resize=()=>battleRenderer.resize(innerWidth,innerHeight);addEventListener("resize",resize);resize();applyZoom();status.classList.add("ready");setLabel("idle")
    battleRenderer.renderer.setAnimationLoop(()=>battleRenderer.render());addEventListener("pagehide",()=>battleRenderer.destroy(),{once:true})
    window.qa={battleRenderer,battleState,player,getView};window.render_game_to_text=()=>JSON.stringify({renderer:"ThreeBattleRenderer",map:{id:map.id,name:map.name,seed:map.seed,revision:map.revision,walls:map.walls.length,water:map.walls.filter(wall=>wall.type==="water").length},hero,requestedHero,state:readout.textContent,animation:getView()?.animation?.state||null,skillPulses:{attack:player.attackPulse,super:player.superPulse,gadget:player.gadgetPulse},clips:getView()?.animation?.actions? [...getView().animation.actions.keys()]:[]})
  </script>
</body>
</html>
