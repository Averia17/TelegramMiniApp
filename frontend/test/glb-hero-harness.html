<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>GLB Hero QA Harness</title>
  <style>
    html,body{margin:0;min-height:100%;background:#d87850}
    canvas{display:block;width:100%;height:100%}
    #app{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:100vh}
    #viewport{position:relative;min-height:100vh}
    #state{position:absolute;left:18px;top:16px;padding:9px 14px;border-radius:10px;background:#17213bcc;color:#fff;font:800 15px system-ui}
    #controls{padding:22px 16px;background:#111a32;color:#fff;font:14px system-ui;box-shadow:-8px 0 24px #42233144}
    #controls h1{margin:0 0 4px;font-size:20px}.hint{margin:0 0 18px;color:#aebce3;font-size:12px;line-height:1.4}
    #hero-select{width:100%;margin:8px 0 18px;padding:10px;border:1px solid #536da7;border-radius:8px;background:#24365f;color:#fff;font:700 14px system-ui}
    #hero-error{margin:-10px 0 18px;color:#ff9e9e;font-size:12px;line-height:1.4}
    .group{margin:0 0 16px}.group strong{display:block;margin-bottom:7px;color:#ffd95a;font-size:11px;text-transform:uppercase;letter-spacing:1px}
    button{width:100%;margin:3px 0;padding:9px 10px;border:1px solid #536da7;border-radius:8px;background:#24365f;color:#fff;text-align:left;font-weight:700;cursor:pointer}
    button:hover,button.active{border-color:#ffd95a;background:#9b563f} @media(max-width:700px){#app{display:block}#viewport{height:70vh;min-height:460px}#controls{min-height:30vh}}
  </style>
</head>
<body>
<div id="app"><section id="viewport"><div id="state">Loading</div><canvas id="scene"></canvas></section><aside id="controls"><h1>Animation Lab</h1><p class="hint">Просмотр locomotion, event и skill-анимаций выбранного героя. Skill-кнопки запускают тот же pulse-контур, что и игровой battle runtime.</p><div class="group"><strong>Locomotion</strong><button data-animation="idle">Покой</button><button data-animation="run">Бег</button></div><div class="group"><strong>Skills</strong><button data-skill="attack">Основная атака</button><button data-skill="super">Супер</button><button data-skill="gadget">Gadget</button></div><div class="group"><strong>Events</strong><button data-animation="spawn">Появление</button><button data-animation="hit">Получил удар</button><button data-animation="victory">Победа</button><button data-animation="defeat">Поражение</button></div><div class="group"><strong>Aim</strong><button data-animation="aim">Прицел</button><button data-animation="aimSuper">Прицел супер</button><button data-animation="aimGadget">Прицел gadget</button></div></aside></div>
<script type="module">
  import * as THREE from "three"
  import {GLBHeroController} from "/src/components/BattleGame/rendering/heroes/GLBHeroController.js"
  import {ProjectileRenderer} from "/src/components/BattleGame/rendering/combat/ProjectileRenderer.js"
  import {AimRenderer} from "/src/components/BattleGame/rendering/combat/AimRenderer.js"
  import {assetRegistry} from "/src/components/BattleGame/rendering/assets/AssetRegistry.js"
  import {resolveHeroName} from "/src/components/BattleGame/rendering/assets/assetManifest.js"
  import {BUSH_HERO_OPACITY} from "/src/components/BattleGame/rendering/heroes/BushConcealment.js"
  import {createBushField} from "/src/components/BattleGame/rendering/map/BushRenderer.js"
  import {MonsterRenderer} from "/src/components/BattleGame/rendering/monsters/MonsterRenderer.js"

  const canvas=document.querySelector("#scene")
  const label=document.querySelector("#state")
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true})
  renderer.setPixelRatio(Math.min(devicePixelRatio,2))
  renderer.outputColorSpace=THREE.SRGBColorSpace
  renderer.toneMapping=THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled=true
  renderer.shadowMap.type=THREE.PCFSoftShadowMap
  const scene=new THREE.Scene()
  scene.background=new THREE.Color(0xd87850)
  const camera=new THREE.OrthographicCamera(-2.7,2.7,2.7,-2.7,.1,50)
  camera.position.set(4.5,4.2,7)
  camera.lookAt(0,1.3,0)
  scene.add(new THREE.HemisphereLight(0xcde9ff,0x70452f,1.7))
  const sun=new THREE.DirectionalLight(0xfff3df,3.2)
  sun.position.set(-5,9,6)
  sun.castShadow=true
  sun.shadow.mapSize.set(1024,1024)
  sun.shadow.bias=-.0004
  sun.shadow.normalBias=.035
  scene.add(sun)
  const ground=new THREE.Mesh(new THREE.CircleGeometry(2.4,48),new THREE.MeshStandardMaterial({color:0xc76848,roughness:1}))
  ground.rotation.x=-Math.PI/2
  ground.receiveShadow=true
  scene.add(ground)

  const query=new URLSearchParams(location.search)
  const requestedHero=query.get("hero")||"Mandy"
  const hero=resolveHeroName(requestedHero)
  const heroSelect=document.createElement("select")
  heroSelect.id="hero-select"
  heroSelect.innerHTML="<option>Загрузка героев...</option>"
  const controls=document.querySelector("#controls")
  controls.insertBefore(heroSelect, controls.querySelector(".group"))
  heroSelect.addEventListener("change",()=>{
    const next=new URL(location.href)
    next.searchParams.set("hero",heroSelect.value)
    next.searchParams.delete("state")
    location.assign(next.href)
  })
  try {
    const response=await fetch("/api/battle/heroes")
    if(!response.ok) throw new Error(`HTTP ${response.status}`)
    const heroes=await response.json()
    heroSelect.innerHTML=heroes.map(item=>`<option value="${item.name}">${item.name}</option>`).join("")
    heroSelect.value=hero
  } catch(error) {
    heroSelect.disabled=true
    heroSelect.innerHTML="<option>Герои недоступны</option>"
    const errorMessage=document.createElement("p")
    errorMessage.id="hero-error"
    errorMessage.textContent="Не удалось загрузить список героев с backend. Проверьте battle-сервис."
    controls.insertBefore(errorMessage, controls.querySelector(".group"))
    console.warn("Could not load heroes from battle backend",error)
  }
  const instance=await assetRegistry.instantiateHero(hero)
  const model=instance.root
  scene.add(model)
  const bushPreview=query.has("bush")
  if(bushPreview){
    const bushes=createBushField([
      {minX:-20,minY:-13,maxX:20,maxY:13},
      {minX:-48,minY:-8,maxX:-22,maxY:18},
      {minX:22,minY:-8,maxX:48,maxY:18},
    ])
    scene.add(bushes)
    model.traverse(node=>{
      if(!node.material)return
      const materials=Array.isArray(node.material)?node.material:[node.material]
      materials.forEach(material=>{
        material.transparent=true
        material.opacity=BUSH_HERO_OPACITY
        material.depthWrite=false
      })
    })
  }
  const forcedState=query.get("state")
  const attackAreas={
    Mandy:{attackArchetype:"melee_cone",attackRange:70,attackHalfArcDegrees:42,color:"#F4C542"},
    Kaze:{attackArchetype:"melee_cone",attackRange:105,attackHalfArcDegrees:55,color:"#B88CFF"},
    "Wukong Mico":{attackArchetype:"melee_cone",attackRange:120,attackHalfArcDegrees:50,color:"#FFB33E"},
    "Brock Zeus":{attackArchetype:"projectile",attackRange:760,color:"#62C8FF"},
  }
  const aimRoot=new THREE.Group()
  const aimPreview=new AimRenderer(aimRoot)
  scene.add(aimRoot)
  if(query.has("aim")){
    aimPreview.update({aiming:true,x:0,y:0,rotation:0,...(attackAreas[hero]||{attackArchetype:"projectile",attackRange:600,color:"#fff"})})
  }
  const clips={idle:"idle",run:"run",hit:"hit",aim:"Aim",aimSuper:"AimSuper",aimGadget:"AimGadget",attack:"Attack",super:"super",gadget:"Gadget",spawn:"Spawn",victory:"Victory",defeat:"death"}
  let attackPulse=0
  let superPulse=0
  let gadgetPulse=0
  const controller=new GLBHeroController(model,instance.animations,clips,{
    companionAnimations:instance.companionAnimations,
    heroName:hero,
    attackPulse,
    superPulse,
    gadgetPulse,
    spawnOnLoad:forcedState==="spawn",
    fullBodySuper:true,
  })
  if(forcedState==="attack")attackPulse++
  if(forcedState==="super")superPulse++
  if(forcedState==="gadget")gadgetPulse++
  let manualState=null
  const setActiveButton=button=>document.querySelectorAll("button").forEach(item=>item.classList.toggle("active",item===button))
  document.querySelectorAll("[data-skill]").forEach(button=>button.addEventListener("click",()=>{
    const skill=button.dataset.skill
    manualState=skill
    if(skill==="attack")attackPulse++
    if(skill==="super")superPulse++
    if(skill==="gadget")gadgetPulse++
    setActiveButton(button)
    label.textContent=`Skill / ${skill}`
  }))
  document.querySelectorAll("[data-animation]").forEach(button=>button.addEventListener("click",()=>{
    const animation=button.dataset.animation
    const played=animation==="spawn"?(controller.playSpawn(),true):["idle","run"].includes(animation)
      ?controller.transitionLocomotion(animation):["victory","defeat"].includes(animation)
        ?controller.playOutcome(animation):["aim","aimSuper"].includes(animation)
          ?(controller.clearOverlay(),true):controller.playSafe(animation)
    if(!played)return
    manualState=animation
    setActiveButton(button)
    label.textContent=`Manual / ${animation}`
  }))
  const projectileRoot=new THREE.Group()
  const projectiles=new ProjectileRenderer(projectileRoot)
  const attackPreview=query.has("attack")
  scene.add(projectileRoot)
  const monsterPreview=new MonsterRenderer(scene)
  if(query.has("bat"))monsterPreview.sync({
    bat_qa:{x:24,y:12,radius:24,rotation:-.35,lives:2700,maxLives:3600,tier:2},
  })
  let hit=0
  let qaFreeze=false
  const clock=new THREE.Clock()
  function resize(){
    const w=innerWidth,h=innerHeight
    renderer.setSize(w,h,false)
    const aspect=w/h
    camera.left=-2.7*aspect;camera.right=2.7*aspect
    camera.updateProjectionMatrix()
  }
  addEventListener("resize",resize);resize()
  renderer.setAnimationLoop(()=>{
    const dt=Math.min(.05,clock.getDelta())
    const forcedCycles={spawn:.35,idle:10.5,run:2.6,aim:4.4,attack:5.05,aimSuper:7.4,super:8.05,gadget:5.05,victory:10.5,defeat:10.5}
    const cycle=manualState?0:(forcedState in forcedCycles?forcedCycles[forcedState]:(performance.now()/1000)%12)
    const moving=cycle>=2&&cycle<7
    const aiming=cycle>=4&&cycle<7
    if(cycle>=5&&cycle<5+dt){attackPulse++;hit=1}
    if(cycle>=8&&cycle<8+dt)superPulse++
    const state=cycle<2?"Spawn / Idle":cycle<4?"Run":cycle<7?"Run + Aim + Attack":cycle<9?"Super":"Idle"
    if(!manualState) label.textContent=state
    const attackFlight=attackPreview||(cycle>=4.65&&cycle<6.35)
    const projectileX=attackPreview?23:-18+(cycle-4.65)*38
    projectiles.sync(hero==="Needle"&&attackFlight?[{id:"qa-spore",kind:"spore",color:"#75D947",radius:15,x:projectileX,y:0,z:attackPreview?12:Math.sin((cycle-4.65)/1.7*Math.PI)*22}]:[])
    projectiles.update(dt,performance.now()/1000)
    monsterPreview.update(dt,performance.now()/1000)
    model.rotation.y=moving?-.45:0
    const manualMoving=manualState==="run"
    if(!qaFreeze)controller.update(dt,{alive:true,moving:manualState?manualMoving:moving,aiming:manualState?manualState==="aim":aiming,superAiming:manualState?manualState==="aimSuper":forcedState==="aimSuper",result:manualState?(["victory","defeat"].includes(manualState)?manualState:null):["victory","defeat"].includes(forcedState)?forcedState:null,speed:(manualState?manualMoving:moving)?300:0,referenceSpeed:285,aimYaw:(manualState?manualState==="aim":aiming)?.95:0,attackPulse,superPulse,gadgetPulse})
    controller.setHitFlash(hit)
    hit*=Math.exp(-10*dt)
    renderer.render(scene,camera)
  })
  window.qa={
    controller,
    model,
    camera,
    renderer,
    getBounds:()=>{
      const box=new THREE.Box3().setFromObject(model)
      return box.isEmpty()?null:box.getSize(new THREE.Vector3()).toArray()
    },
    clips:instance.animations.map(clip=>clip.name),
    triggerAttack:()=>{attackPulse+=1},
    triggerSuper:()=>{superPulse+=1},
    triggerGadget:()=>{gadgetPulse+=1},
    triggerSkill:skill=>{
      manualState=skill
      label.textContent=`Skill / ${skill}`
      if(skill==="attack")attackPulse+=1
      if(skill==="super")superPulse+=1
      if(skill==="gadget")gadgetPulse+=1
    },
    freezeAt:(semanticName,seconds)=>{
      qaFreeze=true
      manualState=semanticName
      hit=0
      label.textContent=`QA / ${semanticName}`
      for(const [name,action] of controller.actions.entries()){
        action.stop()
        action.enabled=true
        action.setEffectiveWeight(0)
        if(name==="idle")action.play()
      }
      const target=controller.actions.get(semanticName)
      if(!target)throw new Error(`missing QA action ${semanticName}`)
      const idle=controller.actions.get("idle")
      if(semanticName.startsWith("aim"))idle?.setEffectiveWeight(semanticName==="aim" ? .18 : 0)
      target.reset()
      target.enabled=true
      target.setEffectiveWeight(1)
      target.play()
      target.time=Math.min(Number(seconds)||0,target.getClip().duration)
      // Freeze the companion on the same semantic clip as the character.
      // Without this, QA frames silently kept Cloud_idle while the character
      // was inspected in attack/super/etc., masking cloud animation defects.
      controller.transitionCloud(semanticName, 0)
      const cloudTarget=controller.cloudActions.get(semanticName)
      if(cloudTarget){
        for(const action of controller.cloudActions.values()){
          action.stop()
          action.enabled=true
          action.setEffectiveWeight(0)
        }
        cloudTarget.reset()
        cloudTarget.enabled=true
        cloudTarget.setEffectiveWeight(1)
        cloudTarget.play()
        cloudTarget.time=Math.min(Number(seconds)||0,cloudTarget.getClip().duration)
      }
      controller.mixer.update(0)
      controller.cloudMixer?.update(0)
      controller.updateAuthoredCloudEffects()
      renderer.render(scene,camera)
    },
  }
  window.render_game_to_text=()=>JSON.stringify({
    hero,
    requestedHero,
    state:label.textContent,
    animation:controller.state,
    overlay:controller.overlay,
    heldProjectile:Boolean(controller.heldProjectile),
    skillPulses:{attack:attackPulse,super:superPulse,gadget:gadgetPulse},
    aimWeight:Number(controller.aimWeight.toFixed(3)),
    actionWeights:Object.fromEntries([...controller.actions.entries()].map(([name,action])=>[name,Number(action.getEffectiveWeight().toFixed(3))])),
    clipTimes:Object.fromEntries([...controller.actions.entries()].map(([name,action])=>[name,Number(action.time.toFixed(3))])),
    fallbackEvents:controller.fallbackEvents,
    cloud:(()=>{
      if(!controller.cloud)return {state:controller.cloudState,actions:[...controller.cloudActions.keys()],position:null,scale:null}
      const bounds=new THREE.Box3().setFromObject(controller.cloud)
      const mesh=controller.cloud.getObjectByProperty("isMesh",true)
      return {
        state:controller.cloudState,
        visible:controller.cloud.visible,
        actions:[...controller.cloudActions.keys()],
        position:bounds.getCenter(new THREE.Vector3()).toArray().map(value=>Number(value.toFixed(3))),
        scale:mesh?mesh.getWorldScale(new THREE.Vector3()).toArray().map(value=>Number(value.toFixed(3))):controller.cloud.scale.toArray().map(value=>Number(value.toFixed(3))),
        bounds:bounds.getSize(new THREE.Vector3()).toArray().map(value=>Number(value.toFixed(3))),
        lightningCharge:Number((controller.cloud.userData.lightningCharge||0).toFixed(3)),
        lightningVisible:Boolean(controller.cloudLightning?.visible),
        materialColor:mesh?.material?.color?.getHexString()||null,
      }
    })(),
    clips:instance.animations.map(clip=>clip.name),
    coordinateSystem:"Three.js: +Y up; ground plane XZ",
  })
</script>
</body>
</html>
