<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>GLB Hero QA Harness</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#d87850}
    canvas{display:block;width:100%;height:100%}
    #state{position:fixed;left:18px;top:16px;padding:9px 14px;border-radius:10px;background:#17213bcc;color:#fff;font:800 15px system-ui}
  </style>
</head>
<body>
<div id="state">Loading</div>
<canvas id="scene"></canvas>
<script type="module">
  import * as THREE from "three"
  import {GLBHeroController} from "/src/components/BattleGame/rendering/heroes/GLBHeroController.js"
  import {ProjectileRenderer} from "/src/components/BattleGame/rendering/combat/ProjectileRenderer.js"
  import {AimRenderer} from "/src/components/BattleGame/rendering/combat/AimRenderer.js"
  import {assetRegistry} from "/src/components/BattleGame/rendering/assets/AssetRegistry.js"
  import {BUSH_HERO_OPACITY} from "/src/components/BattleGame/rendering/heroes/BushConcealment.js"
  import {createBushField} from "/src/components/BattleGame/rendering/map/BushRenderer.js"
  import {MonsterRenderer} from "/src/components/BattleGame/rendering/monsters/MonsterRenderer.js"

  const canvas=document.querySelector("#scene")
  const label=document.querySelector("#state")
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true})
  renderer.setPixelRatio(Math.min(devicePixelRatio,2))
  renderer.outputColorSpace=THREE.SRGBColorSpace
  renderer.toneMapping=THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled=true
  renderer.shadowMap.type=THREE.PCFSoftShadowMap
  const scene=new THREE.Scene()
  scene.background=new THREE.Color(0xd87850)
  const camera=new THREE.OrthographicCamera(-2.7,2.7,2.7,-2.7,.1,50)
  camera.position.set(4.5,4.2,7)
  camera.lookAt(0,1.3,0)
  scene.add(new THREE.HemisphereLight(0xcde9ff,0x70452f,1.7))
  const sun=new THREE.DirectionalLight(0xfff3df,3.2)
  sun.position.set(-5,9,6)
  sun.castShadow=true
  sun.shadow.mapSize.set(1024,1024)
  sun.shadow.bias=-.0004
  sun.shadow.normalBias=.035
  scene.add(sun)
  const ground=new THREE.Mesh(new THREE.CircleGeometry(2.4,48),new THREE.MeshStandardMaterial({color:0xc76848,roughness:1}))
  ground.rotation.x=-Math.PI/2
  ground.receiveShadow=true
  scene.add(ground)

  const query=new URLSearchParams(location.search)
  const hero=query.get("hero")||"Mandy"
  const instance=await assetRegistry.instantiateHero(hero)
  const model=instance.root
  scene.add(model)
  const bushPreview=query.has("bush")
  if(bushPreview){
    const bushes=createBushField([
      {minX:-20,minY:-13,maxX:20,maxY:13},
      {minX:-48,minY:-8,maxX:-22,maxY:18},
      {minX:22,minY:-8,maxX:48,maxY:18},
    ])
    scene.add(bushes)
    model.traverse(node=>{
      if(!node.material)return
      const materials=Array.isArray(node.material)?node.material:[node.material]
      materials.forEach(material=>{
        material.transparent=true
        material.opacity=BUSH_HERO_OPACITY
        material.depthWrite=false
      })
    })
  }
  const forcedState=query.get("state")
  const attackAreas={
    Mandy:{attackArchetype:"melee_cone",attackRange:70,attackHalfArcDegrees:42,color:"#F4C542"},
    Kaze:{attackArchetype:"melee_cone",attackRange:105,attackHalfArcDegrees:55,color:"#B88CFF"},
    "Wukong Mico":{attackArchetype:"melee_cone",attackRange:120,attackHalfArcDegrees:50,color:"#FFB33E"},
    "Brock Zeus":{attackArchetype:"projectile",attackRange:760,color:"#62C8FF"},
  }
  const aimRoot=new THREE.Group()
  const aimPreview=new AimRenderer(aimRoot)
  scene.add(aimRoot)
  if(query.has("aim")){
    aimPreview.update({aiming:true,x:0,y:0,rotation:0,...(attackAreas[hero]||{attackArchetype:"projectile",attackRange:600,color:"#fff"})})
  }
  const clips={idle:"Idle",run:"Run",aim:"Aim",aimSuper:"AimSuper",attack:"Attack",super:"Super",spawn:"Spawn",victory:"Victory",defeat:"Defeat"}
  const controller=new GLBHeroController(model,instance.animations,clips,{
    heroName:hero,
    attackPulse:0,
    superPulse:0,
    spawnOnLoad:!forcedState||forcedState==="spawn",
    fullBodySuper:false,
  })
  const projectileRoot=new THREE.Group()
  const projectiles=new ProjectileRenderer(projectileRoot)
  const attackPreview=query.has("attack")
  scene.add(projectileRoot)
  const monsterPreview=new MonsterRenderer(scene)
  if(query.has("bat"))monsterPreview.sync({
    bat_qa:{x:24,y:12,radius:24,rotation:-.35,lives:2700,maxLives:3600,tier:2},
  })
  let attackPulse=forcedState==="attack"?1:0
  let superPulse=forcedState==="super"?1:0
  let hit=0
  const clock=new THREE.Clock()
  function resize(){
    const w=innerWidth,h=innerHeight
    renderer.setSize(w,h,false)
    const aspect=w/h
    camera.left=-2.7*aspect;camera.right=2.7*aspect
    camera.updateProjectionMatrix()
  }
  addEventListener("resize",resize);resize()
  renderer.setAnimationLoop(()=>{
    const dt=Math.min(.05,clock.getDelta())
    const forcedCycles={spawn:.35,idle:10.5,run:2.6,aim:4.4,attack:5.05,aimSuper:7.4,super:8.05,victory:10.5,defeat:10.5}
    const cycle=forcedState in forcedCycles?forcedCycles[forcedState]:(performance.now()/1000)%12
    const moving=cycle>=2&&cycle<7
    const aiming=cycle>=4&&cycle<7
    if(cycle>=5&&cycle<5+dt){attackPulse++;hit=1}
    if(cycle>=8&&cycle<8+dt)superPulse++
    const state=cycle<2?"Spawn / Idle":cycle<4?"Run":cycle<7?"Run + Aim + Attack":cycle<9?"Super":"Idle"
    label.textContent=state
    const attackFlight=attackPreview||(cycle>=4.65&&cycle<6.35)
    const projectileX=attackPreview?23:-18+(cycle-4.65)*38
    projectiles.sync(hero==="Shadow"&&attackFlight?[{id:"qa-spore",kind:"spore",color:"#75D947",radius:15,x:projectileX,y:0,z:attackPreview?12:Math.sin((cycle-4.65)/1.7*Math.PI)*22}]:[])
    projectiles.update(dt,performance.now()/1000)
    monsterPreview.update(dt,performance.now()/1000)
    model.rotation.y=moving?-.45:0
    controller.update(dt,{alive:true,moving,aiming,superAiming:forcedState==="aimSuper",result:["victory","defeat"].includes(forcedState)?forcedState:null,speed:moving?300:0,referenceSpeed:285,aimYaw:aiming?.95:0,attackPulse,superPulse})
    controller.setHitFlash(hit)
    hit*=Math.exp(-10*dt)
    renderer.render(scene,camera)
  })
  window.qa={
    controller,
    model,
    clips:instance.animations.map(clip=>clip.name),
    triggerAttack:()=>{attackPulse+=1},
    triggerSuper:()=>{superPulse+=1},
  }
  window.render_game_to_text=()=>JSON.stringify({
    state:label.textContent,
    animation:controller.state,
    overlay:controller.overlay,
    aimWeight:Number(controller.aimWeight.toFixed(3)),
    clips:instance.animations.map(clip=>clip.name),
    coordinateSystem:"Three.js: +Y up; ground plane XZ",
  })
</script>
</body>
</html>
