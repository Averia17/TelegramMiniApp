[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shop"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy~=2.0",
    "asyncpg",
    "alembic~=1.0",
    "environs~=14.2.0",
    "uvicorn[standard]~=0.34",
    "fastapi~=0.115",
    "aiokafka~=0.12",
    "httpx~=0.28.1",
]

[tool.setuptools]
py-modules = ["app", "auth", "config", "constants", "consumers", "exeptions", "utils"]

[tool.setuptools.packages.find]
include = ["infrastructure*", "migrations*", "middlewares*", "routes*", "services*"]
