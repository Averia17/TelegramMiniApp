services:
  shop:
    container_name: shop
    image: shop
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file: ../.env
    environment:
      SHOP_DB_HOST: shop-db
      REDIS_HOST: redis
      REDIS_PORT: 6388
      KAFKA_ADDR: kafka:9092
      APP_ENV: production
      APP_AUTH_SECRET: "${APP_AUTH_SECRET}"
    restart: always
    depends_on:
      - shop-db
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  shop-db:
    container_name: shop-db
    image: postgres:13-alpine
    restart: always
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    command: "postgres -c max_connections=150 -c shared_buffers=512MB"
    environment:
      POSTGRES_USER: someusername
      POSTGRES_PASSWORD: postgres_pass12345
      POSTGRES_DB: bot
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

networks:
  app-net:

volumes:
  shop-db-data:
