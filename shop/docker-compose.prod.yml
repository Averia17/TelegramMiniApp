services:
  shop:
    container_name: shop
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    image: "${SHOP_IMAGE:-shop}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env.prod
    expose:
      - "8000"
    environment:
      SHOP_DB_HOST: shop-db
      REDIS_HOST: redis
      REDIS_PORT: 6388
      KAFKA_ADDR: kafka:9092
      APP_ENV: production
      APP_VERSION: "${APP_VERSION:-dev}"
      GIT_SHA: "${GIT_SHA:-unknown}"
    restart: always
    depends_on:
      shop-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  shop-migrate:
    container_name: shop-migrate
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    image: "${SHOP_IMAGE:-shop}"
    env_file:
      - ../.env.prod
    environment:
      SHOP_DB_HOST: shop-db
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      shop-db:
        condition: service_healthy
    networks:
      - app-net

  shop-db:
    container_name: shop-db
    image: postgres@sha256:fb9065b6e3e213bdc07edd372a5b2a26245840b7fb65d1fd8b6700106d51805c
    restart: always
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    command: "postgres -c max_connections=150 -c shared_buffers=512MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-bot}"
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

networks:
  app-net:

volumes:
  shop-db-data:
