services:
  shop:
    container_name: shop
    image: shop
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8000"
    env_file: .env
    restart: always
    depends_on:
      - shop-db
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  shop-db:
    container_name: shop-db
    image: postgres:13-alpine
    ports:
      - "5555:5432"
    restart: always
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    command: "postgres -c max_connections=150 -c shared_buffers=512MB"
    environment:
      POSTGRES_USER: someusername
      POSTGRES_PASSWORD: postgres_pass12345
      POSTGRES_DB: bot
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

networks:
  app-net:

volumes:
  shop-db-data:
