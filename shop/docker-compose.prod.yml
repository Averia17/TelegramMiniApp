services:
  shop:
    container_name: shop
    image: shop
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file: ../.env
    environment:
      SHOP_DB_HOST: shop-db
      REDIS_HOST: redis
      REDIS_PORT: 6388
      KAFKA_ADDR: kafka:9092
      APP_ENV: production
      APP_AUTH_SECRET: "${APP_AUTH_SECRET}"
    restart: always
    depends_on:
      shop-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  shop-db:
    container_name: shop-db
    image: postgres:13-alpine
    restart: always
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    command: "postgres -c max_connections=150 -c shared_buffers=512MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U someusername -d bot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      POSTGRES_USER: someusername
      POSTGRES_PASSWORD: postgres_pass12345
      POSTGRES_DB: bot
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

networks:
  app-net:

volumes:
  shop-db-data:
