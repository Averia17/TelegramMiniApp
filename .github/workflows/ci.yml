name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run deployment tooling tests
        run: python -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Compile deployment tooling
        run: python -m compileall -q deploy news
      - name: Run News service contract tests
        run: |
          python -m pip install --disable-pip-version-check -e news pytest
          python -m pytest news/tests -q
      - name: Run account service tests
        working-directory: account
        run: |
          python -m pip install --disable-pip-version-check -e . pytest
          python -m pytest tests -q
      - name: Run shop service tests
        working-directory: shop
        run: |
          python -m pip install --disable-pip-version-check -e . pytest
          python -m pytest tests -q
      - name: Validate game contracts
        run: |
          python tools/validate_hero_catalog.py
          python tools/validate_combat_profile.py
          python tools/validate_hero_combat_contracts.py
          python tools/generate_combat_profile.py --check
      - name: Scan tracked files for production secrets
        run: |
          python - <<'PY'
          from deploy.release import git, secret_scan

          findings = secret_scan(git("ls-files"))
          if findings:
              raise SystemExit("secret-like values found: " + ", ".join(findings))
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit
          PY

  go:
    name: Go checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [battle, leaderboard, party]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
      - name: Run ${{ matrix.service }} tests
        working-directory: ${{ matrix.service }}
        run: go test ./...
      - name: Scan Go dependencies
        working-directory: ${{ matrix.service }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
