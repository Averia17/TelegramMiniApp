services:
  news:
    container_name: prod-news
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    image: "${NEWS_IMAGE:-news}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env.prod
    environment:
      NEWS_DB_HOST: news-db
      POSTGRES_DB: "${NEWS_DB_NAME:-news}"
      APP_ENV: production
      APP_VERSION: "${APP_VERSION:-dev}"
      GIT_SHA: "${GIT_SHA:-unknown}"
      DEPLOY_ADMIN_TOKEN: "${DEPLOY_ADMIN_TOKEN:?DEPLOY_ADMIN_TOKEN must be set for prod}"
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      news-db:
        condition: service_healthy
      news-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app-net

  news-migrate:
    container_name: prod-news-migrate
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    image: "${NEWS_IMAGE:-news}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env.prod
    environment:
      NEWS_DB_HOST: news-db
      POSTGRES_DB: "${NEWS_DB_NAME:-news}"
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      news-db:
        condition: service_healthy
    networks:
      - app-net

  news-db:
    container_name: prod-news-db
    image: postgres@sha256:fb9065b6e3e213bdc07edd372a5b2a26245840b7fb65d1fd8b6700106d51805c
    restart: unless-stopped
    volumes:
      - news-db-data:/var/lib/postgresql/data
    command: "postgres -c max_connections=100 -c shared_buffers=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${NEWS_DB_NAME:-news}"
    networks:
      - app-net

networks:
  app-net:

volumes:
  news-db-data:
