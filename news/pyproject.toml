[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy~=2.0",
    "asyncpg",
    "alembic~=1.0",
    "environs~=14.2.0",
    "uvicorn[standard]~=0.34",
    "fastapi~=0.115",
]

[tool.setuptools]
py-modules = ["app", "config", "database", "models", "schemas"]

[tool.setuptools.packages.find]
include = ["migrations*"]
