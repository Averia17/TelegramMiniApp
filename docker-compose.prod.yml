include:
  - ./bot/docker-compose.prod.yml
  - ./account/docker-compose.prod.yml
  - ./shop/docker-compose.prod.yml
  - ./battle/docker-compose.prod.yml
  - ./leaderboard/docker-compose.prod.yml
  - ./party/docker-compose.prod.yml
  - ./news/docker-compose.prod.yml

name: prod

services:
  db:
    container_name: prod-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set for prod}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for prod}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set for prod}"

  redis:
    container_name: prod-redis

  bot:
    container_name: prod-bot
    depends_on:
      bot-migrate:
        condition: service_completed_successfully

  account:
    container_name: prod-account

  shop:
    container_name: prod-shop
    depends_on:
      shop-migrate:
        condition: service_completed_successfully

  shop-db:
    container_name: prod-shop-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set for prod}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for prod}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set for prod}"

  battle:
    container_name: prod-battle

  battle-redis:
    container_name: prod-battle-redis

  leaderboard:
    container_name: prod-leaderboard

  leaderboard-redis:
    container_name: prod-leaderboard-redis

  party:
    container_name: prod-party

  news:
    container_name: prod-news

  news-migrate:
    container_name: prod-news-migrate

  news-db:
    container_name: prod-news-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set for prod}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for prod}"
      POSTGRES_DB: "${NEWS_DB_NAME:?NEWS_DB_NAME must be set for prod}"

  frontend:
    container_name: prod-frontend
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    image: "${FRONTEND_IMAGE:-frontend}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /home/node/app
    volumes:
      - frontend-dist:/home/node/app/dist
    command: ["npm", "run", "build"]
    stop_signal: SIGINT
    depends_on:
      - account
    networks:
      - app-net

  nginx:
    container_name: prod-nginx
    user: "101:101"
    init: true
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    image: "${NGINX_IMAGE:-nginx}"
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    volumes:
      - frontend-dist:/src/public:ro
      - ./.release/current:/src/release:ro
      - ./frontend/public/assets/heroes:/src/public/assets/heroes:ro
    depends_on:
      account:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
      battle:
        condition: service_healthy
      shop:
        condition: service_healthy
      leaderboard:
        condition: service_healthy
      party:
        condition: service_healthy
      news:
        condition: service_healthy
    networks:
      - app-net

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    container_name: prod-cloudflared
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set for Cloudflare Tunnel}"
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - app-net

  prometheus:
    image: prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: prod-prometheus
    user: "65534:65534"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    depends_on:
      battle:
        condition: service_healthy
    networks:
      - app-net

  grafana:
    image: grafana/grafana@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: prod-grafana
    user: "472:472"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - app-net

  kafka:
    image: confluentinc/cp-kafka@sha256:88c430304d033c4a1f5bb48798461f7aebbf0a492a8116e13cc0a53516eb1749
    container_name: prod-kafka
    restart: unless-stopped
    expose:
      - "9092"
      - "29093"
    environment:
      CLUSTER_ID: "MkU3o6n8QrO2VZk5eY1hnA"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-net

  kafka-ui:
    image: provectuslabs/kafka-ui@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    restart: always
    container_name: prod-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: true
    networks:
      - app-net

networks:
  app-net:

volumes:
  frontend-dist:
    name: telegramminiapp-prod_frontend-dist
  kafka-data:
    name: telegramminiapp-prod_kafka-data
  db-data:
    name: telegramminiapp-prod_db-data
  redis-data:
    name: telegramminiapp-prod_redis-data
  shop-db-data:
    name: telegramminiapp-prod_shop-db-data
  battle-redis-data:
    name: telegramminiapp-prod_battle-redis-data
  leaderboard-redis-data:
    name: telegramminiapp-prod_leaderboard-redis-data
  party-data:
    name: telegramminiapp-prod_party-data
  news-db-data:
    name: telegramminiapp-prod_news-db-data
  prometheus-data:
    name: telegramminiapp-prod_prometheus-data
  grafana-data:
    name: telegramminiapp-prod_grafana-data
