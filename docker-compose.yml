include:
  - ./bot/docker-compose.yml
  - ./account/docker-compose.yml
  - ./shop/docker-compose.yml
  - ./battle/docker-compose.yml
  - ./leaderboard/docker-compose.yml

services:
  frontend:
    container_name: frontend
    image: frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /home/node/app
    expose:
      - "5173"
    environment:
      # Docker Desktop on Windows may not forward filesystem events reliably.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./frontend:/home/node/app
      - frontend-node-modules:/home/node/app/node_modules
    command: ["npm", "run", "dev"]
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      account:
        condition: service_healthy
    networks:
      - app-net

  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      account:
        condition: service_healthy
      frontend:
        condition: service_healthy
      battle:
        condition: service_healthy
      shop:
        condition: service_healthy
      leaderboard:
        condition: service_healthy
    networks:
      - app-net

  kafka:
    image: confluentinc/cp-kafka:7.4.10
    container_name: kafka
    restart: unless-stopped
    expose:
      - "9092"
      - "29093"
    environment:
      CLUSTER_ID: "MkU3o6n8QrO2VZk5eY1hnA"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: always
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: true
    networks:
      - app-net

networks:
  app-net:

volumes:
  frontend-node-modules:
  kafka-data:
