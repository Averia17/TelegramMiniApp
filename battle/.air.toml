root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/battle-server ."
bin = "./tmp/battle-server"
include_ext = ["go"]
exclude_dir = ["tmp"]
delay = 1000
poll = true
poll_interval = 1000
stop_on_error = false
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[misc]
clean_on_exit = true
