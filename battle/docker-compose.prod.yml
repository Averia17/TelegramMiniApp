services:
  battle:
    container_name: battle
    image: battle
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - REDIS_ADDR=battle-redis:6379
      - APP_AUTH_SECRET=${APP_AUTH_SECRET}
      - APP_ENV=production
      - ACCOUNT_URL=http://account:8000
    restart: unless-stopped
    depends_on:
      account:
        condition: service_healthy
      battle-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - app-net

  battle-redis:
    container_name: battle-redis
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - battle-redis-data:/data
    networks:
      - app-net

networks:
  app-net:

volumes:
  battle-redis-data:
