services:
  battle:
    container_name: battle
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    volumes:
      - .:/app
      - battle-tmp:/app/tmp
    expose:
      - "8000"
      - "6060"
    environment:
      - REDIS_ADDR=battle-redis:6379
      - KAFKA_ADDR=kafka:9092
      - APP_AUTH_SECRET=${APP_AUTH_SECRET:-local-development-auth-secret-change-before-production}
      - APP_ENV=development
    restart: unless-stopped
    depends_on:
      battle-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - app-net

  battle-redis:
    container_name: battle-redis
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - battle-redis-data:/data
    networks:
      - app-net

networks:
  app-net:

volumes:
  battle-redis-data:
  battle-tmp:
