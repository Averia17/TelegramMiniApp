services:
  battle:
    container_name: battle
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    volumes:
      - .:/app
      - battle-tmp:/app/tmp
    expose:
      - "8000"
      - "6060"
    environment:
      - REDIS_ADDR=battle-redis:6379
      - KAFKA_ADDR=kafka:9092
      - APP_AUTH_SECRET=${APP_AUTH_SECRET:-local-development-auth-secret-change-before-production}
      - APP_ENV=development
    restart: unless-stopped
    depends_on:
      - battle-redis
    networks:
      - app-net

  battle-redis:
    container_name: battle-redis
    image: redis:7-alpine
    restart: always
    volumes:
      - battle-redis-data:/data
    networks:
      - app-net

networks:
  app-net:

volumes:
  battle-redis-data:
  battle-tmp:
