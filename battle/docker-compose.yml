services:
  battle:
    container_name: battle
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - REDIS_ADDR=battle-redis:6379
      - KAFKA_ADDR=kafka:9092
    restart: unless-stopped
    depends_on:
      - battle-redis
    networks:
      - app-net

  battle-redis:
    container_name: battle-redis
    image: redis:7-alpine
    restart: always
    volumes:
      - battle-redis-data:/data
    networks:
      - app-net

networks:
  app-net:

volumes:
  battle-redis-data:
