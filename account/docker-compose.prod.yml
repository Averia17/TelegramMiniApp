services:
  account:
    container_name: account
    image: account
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file: ../.env
    environment:
      DB_HOST: db
      SHOP_CATALOG_URL: "http://shop:8000/api/products"
      KAFKA_ADDR: kafka:9092
      APP_ENV: "production"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

networks:
  app-net:
